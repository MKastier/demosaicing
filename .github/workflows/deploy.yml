name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Inštalácia závislostí
        run: npm install

      - name: Build projektu
        run: npm run build

      - name: Príprava pre GitHub Pages
        uses: actions/configure-pages@v4

      - name: Nahratie vytvoreného priečinka dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Nasadenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4