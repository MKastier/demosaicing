<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demosaicing - Semestrálna práca</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <header>
      <h1>Webová aplikace demonstrující debayerizaci obrazu</h1>
      <input type="file" id="imageUpload" accept="image/*" />

      <select id="algorithmSelect">
        <option value="nearest">1. Najbližší sused (Nearest Neighbor)</option>
        <option value="bilinear">2. Bilineárna interpolácia</option>
      </select>
        
      <button id="processBtn" disabled>Použiť algoritmus</button>
    </header>

    <main class="canvas-container">
      <div class="step">
        <h3>1. Originál (RGB)</h3>
        <canvas id="Original"></canvas>
      </div>
      <div class="step">
        <h3>2. Bayerova maska (Mozaika)</h3>
        <canvas id="Bayer"></canvas>
      </div>
      <div class="step">
        <h3>3. Debayerizovanie</h3>
        <canvas id="Debayer"></canvas>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
